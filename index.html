<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>PTN PRO NEWS ENGINE</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; font-family:'Segoe UI', sans-serif; color:white; }
        .studio { position:relative; width:100vw; height:100vh; background:url('studio.jpg') center/cover no-repeat; }
        
        /* विज़ुअल बॉक्स (फोटो/वीडियो) - अब ज़ूम नहीं होगा */
        .visual-box { 
            position:absolute; right:5%; top:12%; width:42%; height:40%; 
            border:4px solid #00f2ff; border-radius:12px; 
            overflow:hidden; background:#000; box-shadow: 0 0 20px #00f2ff; 
        }
        #newsImg { 
            width:100%; height:100%; 
            object-fit: contain; /* 🛑 ज़ूम रोकने के लिए 'cover' की जगह 'contain' किया */
            transition:opacity 0.8s; 
        }
        
        /* स्क्रिप्ट बॉक्स (टेलीप्रॉम्प्टर) */
        .script-box { position:absolute; left:3%; top:12%; width:45%; height:60%; background:rgba(0,0,0,0.85); border-left:10px solid #f00; padding:30px; overflow:hidden; border-radius: 12px; }
        #teleprompter { position:relative; font-size:32px; line-height:1.6; font-weight:bold; top:0; transition:top 0.3s linear; text-align: justify; }
        
        /* एंकर (क्रोमा की) */
        .anchor-container { position:absolute; right:0; bottom:0; width:65%; height:100%; display:flex; justify-content:flex-end; align-items:flex-end; pointer-events:none; }
        #anchorCanvas { max-width:100%; max-height:100%; }
        #anchorVid { display:none; }
        
        /* टिकर बार */
        .ticker-bar { position:absolute; bottom:0; width:100%; height:85px; background:linear-gradient(90deg, #b00, #500); display:flex; align-items:center; border-top:4px solid #fff; }
        marquee { font-size:38px; font-weight:bold; }

        /* प्रो-कंट्रोल पैनल */
        .admin-panel { position:absolute; top:20px; right:20px; z-index:999; display:flex; gap:10px; }
        .admin-btn { background:rgba(255,255,255,0.2); border:1px solid #fff; color:white; padding:10px 20px; cursor:pointer; border-radius:5px; font-weight:bold; }
        .admin-btn:hover { background:#f00; }
    </style>
</head>
<body>
    <div class="studio">
        <div class="admin-panel">
            <button class="admin-btn" onclick="togglePause()">PAUSE/PLAY</button>
            <button class="admin-btn" onclick="nextNews()">NEXT NEWS ⏭</button>
        </div>

        <div class="visual-box"><img id="newsImg" src=""></div>
        <div class="script-box"><div id="teleprompter">क्लिक करें न्यूज़ शुरू करने के लिए...</div></div>
        <div class="anchor-container"><canvas id="anchorCanvas"></canvas></div>
        <video id="anchorVid" muted loop crossorigin="anonymous"><source src="anchor_video.mp4" type="video/mp4"></video>
        <div class="ticker-bar"><marquee id="flashTicker">PTN AI NEWS LIVE...</marquee></div>
    </div>
    <audio id="bgMusic" loop><source src="news_theme.mp3" type="audio/mpeg"></audio>

<script>
    // --- अपनी जानकारी यहाँ भरें ---
    const sheetId = '1q8Eq1K1EpI-X87qc9ngmwLUrUXRRanTMZrRKKJh_rjA'; 
    const sheetName = 'Sheet1';
    const jsonUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

    let newsItems = [], newsIndex = 0, imageInterval, isPaused = false;
    const video = document.getElementById("anchorVid"), 
          canvas = document.getElementById("anchorCanvas"), 
          // 🛑 Warning ठीक करने के लिए willReadFrequently: true जोड़ा
          ctx = canvas.getContext("2d", { willReadFrequently: true }),
          bgMusic = document.getElementById("bgMusic");

    // --- लॉजिकल क्रोमा की (हाई क्वालिटी) ---
    function processChroma() {
        if (video.paused || isPaused) return;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let data = frame.data;
        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            // ग्रीन स्क्रीन लॉजिक (थोड़ा स्मूथ)
            if (g > 80 && g > r * 1.3 && g > b * 1.3) {
                data[i+3] = 0; // Transparent
            }
        }
        ctx.putImageData(frame, 0, 0);
        requestAnimationFrame(processChroma);
    }

    // --- लॉजिकल स्लाइड शो ---
    function startSlideshow(linksText) {
        const img = document.getElementById("newsImg");
        clearInterval(imageInterval);
        if(!linksText) return;
        const links = linksText.split(',').map(l => l.trim());
        let idx = 0;
        img.src = links[idx];
        if(links.length > 1) {
            imageInterval = setInterval(() => {
                idx = (idx + 1) % links.length;
                img.style.opacity = "0";
                setTimeout(() => { img.src = links[idx]; img.style.opacity = "1"; }, 500);
            }, 6000);
        }
    }

    // --- डेटा लोडर (Error Handling के साथ) ---
    async function loadData() {
        try {
            const res = await fetch(jsonUrl);
            const text = await res.text();
            const json = JSON.parse(text.substr(47).slice(0, -2));
            
            newsItems = json.table.rows.map(row => ({
                script: row.c[0] ? row.c[0].v : "",
                visual: row.c[1] ? row.c[1].v : "",
                flash:  row.c[2] ? row.c[2].v : "" 
            })).filter(item => item.script !== "");

            if(newsItems.length > 0) playNews();
            else alert("शीट खाली है!");
        } catch (err) { alert("Data Load Error: Check Sheet URL"); }
    }

    // --- मुख्य न्यूज़ इंजन (Fully Logical) ---
    function playNews() {
        if(newsIndex >= newsItems.length) { newsIndex = 0; bgMusic.pause(); return; }
        if(isPaused) { setTimeout(playNews, 1000); return; }

        const item = newsItems[newsIndex];
        const prompter = document.getElementById("teleprompter");
        
        prompter.innerText = item.script;
        prompter.style.top = "0px";
        document.getElementById("flashTicker").innerText = item.flash;
        startSlideshow(item.visual);

        window.speechSynthesis.cancel();
        
        // **ADVANCE TTS LOGIC**
        const msg = new SpeechSynthesisUtterance(item.script);
        msg.lang = 'hi-IN';
        msg.rate = 0.9;
        msg.pitch = 1;

        msg.onstart = () => { 
            video.play(); 
            bgMusic.play();
            bgMusic.volume = 0.1;
            canvas.width = video.videoWidth; 
            canvas.height = video.videoHeight; 
            processChroma(); 
        };

        // **Logical Teleprompter Scrolling**
        msg.onboundary = (event) => {
            if (event.name === 'word') {
                const percentage = event.charIndex / item.script.length;
                if(prompter.scrollHeight > 500) {
                    prompter.style.top = `-${percentage * (prompter.scrollHeight - 300)}px`;
                }
            }
        };

        msg.onend = () => { 
            video.pause(); 
            bgMusic.volume = 0.4;
            newsIndex++; 
            setTimeout(playNews, 2000); 
        };

        window.speechSynthesis.speak(msg);
    }

    // --- एडमिन कंट्रोल्स ---
    function togglePause() {
        isPaused = !isPaused;
        if(isPaused) {
            window.speechSynthesis.pause();
            video.pause();
        } else {
            window.speechSynthesis.resume();
            video.play();
            processChroma();
        }
    }

    function nextNews() {
        window.speechSynthesis.cancel();
        newsIndex++;
        playNews();
    }

    window.onclick = () => { if(newsItems.length === 0) loadData(); };
</script>
</body>
</html>
